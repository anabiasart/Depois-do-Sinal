name: Build e regressão
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run check
      - run: npm test
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Testar jogo
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/bellmont-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
